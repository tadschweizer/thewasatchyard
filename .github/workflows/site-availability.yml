name: Site availability
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage and registration pointer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://wasatchyard.com/ --output /tmp/wasatch-home.html
          grep -Fq 'https://ultrasignup.com/register.aspx?did=138776' /tmp/wasatch-home.html
          grep -Fq 'Content-Security-Policy' /tmp/wasatch-home.html
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://wasatchyard.com/assets/site.js --output /dev/null
